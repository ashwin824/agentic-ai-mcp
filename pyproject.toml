[project]
name = "agent-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashwin Patel", email = "ashwin0824@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agent-mcp = "agent_mcp:main"

[build-system]
